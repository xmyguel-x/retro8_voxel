name: build-android
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar (arm64)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK="$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -1)"
          fi
          echo "NDK=$NDK"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          "$CC" -shared -fPIC -O3 -ffast-math -fvisibility=hidden -Wl,-z,max-page-size=16384 \
              -o retro8_voxel_libretro_android.so retro8_voxel.c -lm -ldl
      - uses: actions/upload-artifact@v4
        with:
          name: retro8_voxel_libretro_android
          path: retro8_voxel_libretro_android.so
