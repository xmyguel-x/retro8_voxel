name: build-android
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar (arm64)
        run: |
          NDK="$ANDROID_NDK_LATEST_HOME"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          $CC -shared -fPIC -O3 -ffast-math -fvisibility=hidden -Wl,-z,max-page-size=16384 \
              -o retro8_voxel_libretro_android.so retro8_voxel.c -lm -ldl
      - uses: actions/upload-artifact@v4
        with:
          name: retro8_voxel_libretro_android
          path: retro8_voxel_libretro_android.so
